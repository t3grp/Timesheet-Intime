name: NPM Test Unit

on:
  pull_request:
    types: [labeled, unlabeled, opened, synchronize, reopened, ready_for_review, edited]
  schedule:
    - cron: '12 18 * * *'
permissions:
  contents: read

jobs:
  build:
    if: ${{ github.event_name != 'pull_request' || (github.event.pull_request.head.repo.full_name == github.repository && contains(github.event.pull_request.labels.*.name, 'release')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      TZ: UTC

    steps:
      - name: "Checkout code"
        uses: actions/checkout@v7

      - name: "Use Node.js"
        uses: actions/setup-node@v7
        with:
          node-version: '20.x'

      - name: "Install npm dependencies"
        run: npm ci

      - name: "Run vitest"
        run: npm run test:unit
