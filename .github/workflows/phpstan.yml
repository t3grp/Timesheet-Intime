name: Static code analysis (PHPStan)
on:
  pull_request:
    types: [labeled, unlabeled, opened, synchronize, reopened, ready_for_review, edited]
  schedule:
    - cron: '59 18 * * *'
permissions:
  contents: read
jobs:
  phpstan:
    if: ${{ github.event_name != 'pull_request' || (github.event.pull_request.head.repo.full_name == github.repository && contains(github.event.pull_request.labels.*.name, 'release')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: "Checkout code"
        uses: actions/checkout@v7

      - name: "Setup PHP"
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: dom, curl, libxml, mbstring, zip, pcntl, pdo, sqlite, pdo_sqlite, bcmath, soap, intl, gd, exif, iconv
          coverage: none

      - name: "Run composer install"
        run: composer install -n --prefer-dist

      - name: "Run PHPStan"
        run: composer analyse


